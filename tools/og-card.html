<!doctype html>
<!-- Link-preview card (1200x630). Render with: sh tools/og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b0d12;
    background-image:
      radial-gradient(700px 500px at 95% 10%, rgba(255,181,71,.20), transparent 60%),
      radial-gradient(600px 500px at 0% 100%, rgba(94,224,192,.14), transparent 60%),
      radial-gradient(500px 400px at 60% 110%, rgba(140,110,255,.14), transparent 60%);
    color: #e9ecf2; font-family: Inter, sans-serif; position: relative;
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .who { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
  .who img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #262c3b; }
  .name { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 50px; line-height: 1.05; }
  .role { color: #ffb547; font-weight: 600; font-size: 24px; margin-top: 6px; }
  .tag { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 33px; line-height: 1.25; margin: 0 0 30px; }
  .tag em { font-style: normal; color: #ffb547; }
  .url { color: #5ee0c0; font-weight: 600; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
  .covers {
    position: absolute; right: -12px; top: 22px; width: 540px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    transform: rotate(-8deg); transform-origin: center;
  }
  .covers img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px; border: 1px solid #262c3b; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  .covers img:nth-child(3n+2) { transform: translateY(46px); }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0b0d12 0%, #0b0d12 47%, rgba(11,13,18,.35) 56%, rgba(11,13,18,0) 64%); }
</style>
</head>
<body>
  <div class="covers">
    <img src="../docs/img/2024/07/12902939-83c5-4088-a845-5159d69d9f05-AP_Madden_20_Cover.thumb.webp" alt="">
    <img src="../docs/img/2024/07/mono2.thumb.webp" alt="">
    <img src="../docs/img/2025/10/NFL_Rivals-scaled.thumb.webp" alt="">
    <img src="../docs/img/2024/07/maxresdefault-3.thumb.webp" alt="">
    <img src="../docs/img/2024/07/71AfEligLcL._AC_UF10001000_QL80_.thumb.webp" alt="">
    <img src="../docs/img/2024/07/avnu-1.thumb.webp" alt="">
  </div>
  <div class="fade"></div>
  <div class="text">
    <div class="who">
      <img src="../docs/img/2026/11/portrait-2026.webp" alt="">
      <div><div class="name">Patrick Bellanca</div><div class="role">Lead Game Designer</div></div>
    </div>
    <p class="tag"><strong>20 shipped games</strong> — from <em>Madden NFL</em> to <em>Monopoly GO!</em> to my own indie titles.</p>
    <div class="url">patrickbellanca.com</div>
  </div>
</body>
</html>
